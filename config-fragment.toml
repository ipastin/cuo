# Universal Orchestration v5 · Codex CLI / desktop / IDE · ChatGPT Pro sign-in
# If config.toml exists, merge these supported settings manually.
# Does not change authentication, MCP or product-runtime model routing.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
review_model = "gpt-6.1-sol"

[agents]
enabled = true
max_concurrent_threads_per_session = 5
# Safe default for an unnamed/untyped child: Sol. Luna is explicitly selected for cuo-scout.
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"
